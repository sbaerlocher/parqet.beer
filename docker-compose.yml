---
services:
  worker:
    image: node:26.13.0-slim@sha256:5adad64f9a1fca2d51972caa65983634c8a774eb300d72b20f7f2a0f60368072
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules # anonymous volumes — run `dde project:down -v` to clear after lockfile changes
      - /app/.svelte-kit
      - /app/.pnpm-store
    command: ['pnpm', 'dev', '--host', '0.0.0.0']
    # Router/service names carry the compose project name and the host is dde's
    # canonical `<project>.test`: dde rewrites that host per git worktree
    # (`<suffix>.parqet.beer.test`), and unique router names keep main and
    # worktrees from colliding in Traefik (a shared name drops both routes).
    # Start worktrees only via `dde project:up`: plain `docker compose up` skips
    # the host rewrite, and two routers would then silently share one host.
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-parqet-beer}.rule=Host(`parqet.beer.test`)'
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-parqet-beer}.tls=true'
      - 'traefik.http.services.${COMPOSE_PROJECT_NAME:-parqet-beer}.loadbalancer.server.port=5173'
    env_file:
      - .dev.vars

networks:
  default:
    name: dde
    external: true
