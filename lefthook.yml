pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,svelte,json,md,yml,yaml,css}'
      run: pnpm prettier --check {staged_files}
    eslint:
      glob: '*.{js,ts,svelte}'
      run: pnpm eslint {staged_files}

# Hooks call pnpm directly, not the just recipes: lefthook is installed for
# every contributor via the `prepare` script, including the documented
# non-DDE path (Node + pnpm only), where `just` is absent and its recipes
# would delegate into a container that does not exist.
pre-push:
  commands:
    typecheck:
      run: pnpm check
    test:
      run: pnpm test
